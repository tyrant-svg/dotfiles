# sleek_cyber — tmux config matching Hyprland rice

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# ── Behaviour ─────────────────────────────────────────────────────────────────
set -sg escape-time    0
set -g  mouse          on
set -g  history-limit  50000
set -g  base-index     1
set -g  pane-base-index 1
set -g  renumber-windows on
set -g  focus-events   on

# ── Vim keys ──────────────────────────────────────────────────────────────────
set  -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits (keep current path) ────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Copy mode → wl-copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message " config reloaded"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status          on
set -g status-position top
set -g status-interval 2
set -g status-style    "bg=#16130b,fg=#cdc6b4"
set -g status-justify  centre
set -g status-left-length  30
set -g status-right-length 50

# Left: session name
set -g status-left  "#[fg=#ddc66e,bold] #S #[fg=#4b4739,nobold]│ "

# Right: date + time
set -g status-right "#[fg=#4b4739]│ #[fg=#cdc6b4]%a %d %H:%M #[fg=#4b4739]│ #[fg=#ddc66e]#h "

# Window tabs
set -g window-status-format          "#[fg=#4b4739] #I:#W "
set -g window-status-current-format  "#[fg=#16130b,bg=#ddc66e,bold] #I:#W "
set -g window-status-separator       ""

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#4b4739"
set -g pane-active-border-style "fg=#ddc66e"

# ── Messages + copy mode ──────────────────────────────────────────────────────
set -g message-style         "bg=#221f17,fg=#ddc66e"
set -g message-command-style "bg=#221f17,fg=#cdc6b4"
set -g mode-style            "bg=#ddc66e,fg=#16130b"

# ── Accent colors (generated by wallpaper-switch) ─────────────────────────────
source-file ~/.config/tmux/colors.conf
