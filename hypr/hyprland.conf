# Hyprland — main entry point
# Modular config: edit individual files, reload with hyprctl reload

# ── Plugins (managed by hyprpm) ───────────────────────────────────────────────
# Setup: hyprpm add https://github.com/hyprwm/hyprland-plugins && hyprpm enable hyprexpo
exec-once = hyprpm reload -n

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/window.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/keybinds.conf

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = awww-daemon && awww img ~/Pictures/Wallpapers/sleek_cyber.png --transition-type fade --transition-duration 2
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = eww daemon
# Clipboard history daemon — requires: paru -S cliphist
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

###########
### MISC ###
###########
misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = true
    vfr                      = true
}

