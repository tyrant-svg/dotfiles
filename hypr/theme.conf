#####################
### LOOK AND FEEL ###
#####################
# Palette: sleek_cyber — dark charcoal base, gold primary, cyan secondary
# bg:          #16130b   surface:     #221f17   surface_hi:  #2d2a21
# fg:          #e9e2d4   fg_muted:    #cdc6b4
# gold:        #ddc66e   gold_dim:    #d2c6a1
# cyan:        #00d9ff   border:      #4b4739

general {
    gaps_in  = 4
    gaps_out = 10
    border_size = 2
    col.active_border   = $accent_border $accent_border_dim 45deg
    col.inactive_border = rgba(4b473966)
    resize_on_border  = true
    allow_tearing     = false
    layout            = dwindle
}

decoration {
    rounding         = 6
    active_opacity   = 1.0
    inactive_opacity = 0.92
    dim_inactive     = true
    dim_strength     = 0.15

    blur {
        enabled           = true
        size              = 4
        passes            = 2
        new_optimizations = true
        xray              = false
        noise             = 0.01
        contrast          = 0.9
        brightness        = 0.9
        vibrancy          = 0.1
        popups            = true
    }

    shadow {
        enabled        = true
        range          = 30
        render_power   = 2
        color          = rgba(ddc66e38)   # gold glow on focused windows
        color_inactive = rgba(00000033)
    }
}

dwindle {
    pseudotile     = true
    preserve_split = true
    smart_resizing = true
}
