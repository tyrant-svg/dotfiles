####################
### KEYBINDINGS  ###
####################
$mod      = SUPER
$terminal = kitty
$launcher = rofi -show drun -theme ~/.config/rofi/theme.rasi

# ── Core ──────────────────────────────────────────────────────────────────────
bind = $mod,        Return,  exec,          $terminal
bind = $mod,        Q,       killactive
bind = $mod SHIFT,  E,       exit
bind = $mod,        F,       fullscreen
bind = $mod,        V,       togglefloating
bind = $mod,        Space,   exec,          $launcher
bind = $mod,        E,       exec,          kitty --class yazi -e yazi
bind = $mod,        B,       exec,          firefox
bind = $mod,        P,       pseudo
bind = $mod,        T,       togglesplit

# Lock — moved to Shift+L to free $mod+L for vim focus
bind = $mod SHIFT,  L,       exec,          hyprlock

# ── Modes ─────────────────────────────────────────────────────────────────────
bind = $mod,        F11,     exec,          ~/.local/bin/rice-mode

# ── Focus — arrow keys ────────────────────────────────────────────────────────
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# ── Focus — vim keys ──────────────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── Move windows — arrow keys ─────────────────────────────────────────────────
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# ── Resize — arrow keys ───────────────────────────────────────────────────────
binde = $mod CTRL, right, resizeactive,  50  0
binde = $mod CTRL, left,  resizeactive, -50  0
binde = $mod CTRL, up,    resizeactive,   0 -50
binde = $mod CTRL, down,  resizeactive,   0  50

# ── Resize — vim keys ─────────────────────────────────────────────────────────
binde = $mod SHIFT, H, resizeactive, -50  0
binde = $mod SHIFT, J, resizeactive,   0  50
binde = $mod SHIFT, K, resizeactive,   0 -50
binde = $mod SHIFT, L, resizeactive,  50  0

# ── Workspaces ────────────────────────────────────────────────────────────────
bind = $mod,       1, workspace,        1
bind = $mod,       2, workspace,        2
bind = $mod,       3, workspace,        3
bind = $mod,       4, workspace,        4
bind = $mod,       5, workspace,        5
bind = $mod,       6, workspace,        6
bind = $mod,       7, workspace,        7
bind = $mod,       8, workspace,        8
bind = $mod,       9, workspace,        9
bind = $mod,       0, workspace,        10
bind = $mod SHIFT, 1, movetoworkspace,  1
bind = $mod SHIFT, 2, movetoworkspace,  2
bind = $mod SHIFT, 3, movetoworkspace,  3
bind = $mod SHIFT, 4, movetoworkspace,  4
bind = $mod SHIFT, 5, movetoworkspace,  5
bind = $mod SHIFT, 6, movetoworkspace,  6
bind = $mod SHIFT, 7, movetoworkspace,  7
bind = $mod SHIFT, 8, movetoworkspace,  8
bind = $mod SHIFT, 9, movetoworkspace,  9
bind = $mod SHIFT, 0, movetoworkspace,  10

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = $mod,       S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspacesilent,  special:magic

# ── Scroll workspaces ─────────────────────────────────────────────────────────
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Mouse window control ──────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Media keys ────────────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay,        exec, playerctl play-pause
bind = , XF86AudioPrev,        exec, playerctl previous
bind = , XF86AudioNext,        exec, playerctl next

# ── Screenshots ───────────────────────────────────────────────────────────────
# Super+Shift+S → region select → swappy (annotate/copy/save)
# Super+Shift+F → full screen  → swappy
# Super+Z       → region select → instant clipboard (no editor, fast)
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, F, exec, grim - | swappy -f -
bind = $mod,       Z, exec, grim -g "$(slurp)" - | wl-copy && notify-send -t 2000 "Screenshot" "Region copied to clipboard"

# ── Notifications ─────────────────────────────────────────────────────────────
bind = $mod, N, exec, dunstctl close-all

# ── Utilities ─────────────────────────────────────────────────────────────────
# Network menu — floating nmtui (requires: nmtui)
bind = $mod, W, exec, kitty --class nmtui-float --title "Network" -e nmtui

# Clipboard history — requires: yay -S cliphist
bind = $mod, C, exec, cliphist list | rofi -dmenu -p "clipboard" -theme ~/.config/rofi/theme.rasi | cliphist decode | wl-copy

# Wallpaper switcher — random from ~/Pictures/Wallpapers/
bind = $mod, backslash, exec, ~/.local/bin/wallpaper-switch --random

# Power menu
bind = $mod SHIFT, Escape, exec, wlogout --protocol layer-shell -b 5 -T 400 -B 400 --css ~/.config/wlogout/style.css

# Workspace overview — uncomment after: yay -S hyprland-plugin-hyprexpo
# bind = $mod, grave, hyprexpo:expo, toggle
