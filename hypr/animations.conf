################
### ANIMATIONS ###
################
animations {
    enabled = true

    # Bezier curves
    bezier = ease,     0.25, 0.1,  0.25, 1.0
    bezier = overshot, 0.05, 0.9,  0.1,  1.05
    bezier = smooth,   0.4,  0.0,  0.2,  1.0
    bezier = snappy,   0.2,  0.0,  0.0,  1.0
    bezier = cyber,    0.16, 1.0,  0.3,  1.0   # quick ease-out, sci-fi snappiness

    # Windows: slide in fast, no bounce
    animation = windows,          1, 3, cyber,  slide
    animation = windowsOut,       1, 2, snappy, slide
    animation = border,           1, 6, smooth
    animation = borderangle,      1, 30, smooth, loop   # rotating border gradient
    animation = fade,             1, 3, smooth
    animation = workspaces,       1, 3, snappy, slide
    animation = specialWorkspace, 1, 3, snappy, slidevert
}
