# ═══════════════════════════════════════════════════════════════════
# sleek_cyber starship prompt — gold/charcoal palette
# ═══════════════════════════════════════════════════════════════════

format = """
[╭─](bold white)\
$directory\
$git_branch\
$git_status\
$rust\
$python\
$rlang\
$nodejs\
$cmd_duration
[╰─](bold white)$character"""

[character]
success_symbol = "[❯](bold yellow)"
error_symbol   = "[❯](bold red)"

[directory]
style             = "bold yellow"
truncation_length = 3
truncate_to_repo  = true
format            = "[$path]($style) "
read_only         = " "
read_only_style   = "#ffb4ab"

[git_branch]
symbol = " "
style  = "bold #aad0b2"
format = "[$symbol$branch]($style) "

[git_status]
style       = "#d2c6a1"
format      = '([\[$all_status$ahead_behind\]]($style) )'
conflicted  = "!"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
untracked   = "?"
stashed     = "≡"
modified    = "~"
staged      = "+"
renamed     = "»"
deleted     = "✘"

[cmd_duration]
min_time = 500
style    = "#cdc6b4"
format   = "[  $duration]($style) "

[rust]
symbol = " "
style  = "bold #d2c6a1"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style  = "bold #d2c6a1"
format = "[$symbol$version]($style) "

[rlang]
symbol = "󰟔 "
style  = "bold #d2c6a1"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style  = "bold #d2c6a1"
format = "[$symbol$version]($style) "
